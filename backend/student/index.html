<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Chatroom</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>🎓 Student Chatroom</h2>

    <div id="join-form">
      <input type="text" id="studentId" placeholder="Student ID" />
      <input type="text" id="standard" placeholder="Standard (e.g. 10)" />
      <input type="text" id="division" placeholder="Division (e.g. A)" />
      <button onclick="joinChatroom()">Join Chatroom</button>
    </div>

    <div id="chatroom" style="display: none;">
      <div id="messages"></div>
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
